<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lounge Suite • Master Edition</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    html, body {
      width: 100%; height: 100dvh; background: #09090b; color: #fff;
      overflow: hidden; display: flex; flex-direction: column; touch-action: manipulation;
    }

    /* Couple / Intimate Atmosphere Theme */
    body.couple-active {
      background: #080503 !important;
    }
    body.couple-active video {
      filter: brightness(0.8) contrast(0.95) sepia(0.35) !important;
      transition: filter 0.8s ease;
    }
    body.couple-active .top-bar, body.couple-active .controls-bar {
      background: rgba(14, 9, 6, 0.96) !important;
      border-color: #2b180d !important;
    }

    /* Top Navigation Header */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 50px; padding: 0 14px;
      background: rgba(24, 24, 27, 0.94); backdrop-filter: blur(8px);
      border-bottom: 1px solid #27272a; display: flex; justify-content: space-between;
      align-items: center; z-index: 100;
    }
    .room-badge {
      font-size: 13px; background: #27272a; padding: 4px 10px; border-radius: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .btn-text { background: none; border: none; color: #38bdf8; font-weight: 600; font-size: 12px; cursor: pointer; }

    /* Video Player & YouTube Container */
    #mainVideoContainer {
      position: absolute; top: 50px; bottom: 84px; left: 0; right: 0;
      background: #000; display: flex; align-items: center; justify-content: center;
      z-index: 20; overflow: hidden;
    }
    #mainPlayer { width: 100%; height: 100%; object-fit: contain; }
    #ytWrapper { width: 100%; height: 100%; display: none; }
    #ytPlayer { width: 100%; height: 100%; }

    /* Face-to-Face Split Screen Mode */
    #callGridWrapper {
      display: none; position: absolute; top: 50px; bottom: 84px; left: 0; right: 0;
      padding: 6px; gap: 6px; z-index: 50; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr;
    }
    @media (min-width: 650px) {
      #callGridWrapper { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    }
    body.call-only-mode #mainVideoContainer { display: none !important; }
    body.call-only-mode #callGridWrapper { display: grid !important; }
    body.call-only-mode .pip-box {
      position: relative !important; top: auto !important; bottom: auto !important;
      left: auto !important; right: auto !important; width: 100% !important; height: 100% !important;
      border-radius: 12px; cursor: default; box-shadow: none;
    }

    /* Dual-PiP System */
    .pip-box {
      position: absolute; width: 110px; height: 146px; border-radius: 14px;
      overflow: hidden; background: #18181b; border: 2px solid #3f3f46;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 60; cursor: grab;
      touch-action: none; transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .pip-box:active { cursor: grabbing; }
    .pip-box video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .pip-box video.mirror-mode { transform: scaleX(-1); }
    .pip-label {
      position: absolute; bottom: 4px; left: 6px; background: rgba(0,0,0,0.7);
      padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
    }
    .audio-avatar {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #1e1e24;
    }
    .pip-reacting {
      border-color: #00ffa3 !important;
      box-shadow: 0 0 25px rgba(0, 255, 163, 0.85) !important;
    }
    .couch-mode-local {
      left: 8% !important; top: auto !important; bottom: 96px !important;
      width: 140px !important; height: 105px !important;
    }
    .couch-mode-remote {
      left: 54% !important; top: auto !important; bottom: 96px !important;
      width: 140px !important; height: 105px !important;
    }

    /* Doodle Canvas Layer */
    #doodleCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; touch-action: none; z-index: 70;
    }
    #doodleCanvas.drawing-active { pointer-events: auto !important; }

    /* Interactive Whispers Stream */
    .whisper-container {
      position: absolute; bottom: 140px; left: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 85;
    }
    .whisper-bubble {
      position: relative; padding: 10px 16px; border-radius: 20px;
      font-size: 13.5px; font-weight: 500; max-width: 78%; backdrop-filter: blur(12px);
      pointer-events: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, filter 0.3s ease, opacity 0.4s ease;
      animation: whisperDrift 5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }
    .whisper-local {
      align-self: flex-end; background: rgba(14, 165, 233, 0.85); color: #fff;
      border-bottom-right-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .whisper-remote {
      align-self: flex-start; background: rgba(236, 72, 153, 0.85); color: #fff;
      border-bottom-left-radius: 4px; border: 1px solid rgba(244, 114, 182, 0.4);
    }
    .whisper-secret {
      background: rgba(24, 24, 27, 0.92) !important; border: 1.5px dashed #f59e0b !important;
      color: #fbbf24 !important; cursor: pointer; filter: blur(4px); user-select: none; touch-action: none;
    }
    .whisper-secret.unlocked {
      filter: blur(0px) !important; border-style: solid !important; border-color: #38bdf8 !important;
      color: #f8fafc !important; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6) !important;
    }
    @keyframes meltAway {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      50% { transform: scale(1.05); filter: blur(2px); }
      100% { transform: scale(0.6) translateY(-30px); opacity: 0; filter: blur(10px); }
    }
    @keyframes whisperDrift {
      0% { opacity: 0; transform: translateY(20px) scale(0.9); }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-45px); }
    }
    .whisper-chip-row {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .whisper-chip-row::-webkit-scrollbar { display: none; }
    .w-chip {
      background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7;
      padding: 5px 10px; border-radius: 12px; font-size: 11px; white-space: nowrap; cursor: pointer;
    }
    .w-chip:active { background: #ec4899; }

    /* Live Dual-Language Subtitles Banner */
    #subtitleBanner {
      position: fixed; bottom: 95px; left: 16px; right: 16px;
      background: rgba(15, 15, 20, 0.92); border: 1px solid #3f3f46; border-radius: 14px;
      padding: 10px 16px; z-index: 999; backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: none;
    }

    /* Floating Reaction Emoji Bursts */
    .reaction-burst-box {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      font-size: 54px; pointer-events: none; z-index: 90;
      animation: popBurst 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes popBurst {
      0% { transform: translate(-50%, 0) scale(0.3); opacity: 0; }
      20% { transform: translate(-50%, -40px) scale(1.4); opacity: 1; }
      80% { transform: translate(-50%, -120px) scale(1.0); opacity: 1; }
      100% { transform: translate(-50%, -180px) scale(0.6); opacity: 0; }
    }

    /* Fixed Bottom Action Dock */
    .controls-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 84px;
      padding: 8px 10px max(12px, env(safe-area-inset-bottom));
      background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid #27272a; display: flex; justify-content: flex-start;
      align-items: center; gap: 10px; overflow-x: auto; z-index: 100; scrollbar-width: none;
    }
    .controls-bar::-webkit-scrollbar { display: none; }
    .c-btn {
      width: 44px; height: 44px; border-radius: 22px; border: none;
      background: #27272a; color: white; font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background 0.2s ease; flex-shrink: 0;
    }
    .c-btn:active { transform: scale(0.88); }
    .c-btn.btn-active-pink { background: #ec4899 !important; box-shadow: 0 0 16px rgba(236,72,153,0.7); }
    .c-btn.btn-active-purple { background: #a855f7 !important; box-shadow: 0 0 16px rgba(168,85,247,0.7); }
    .c-btn.btn-active-blue { background: #0ea5e9 !important; box-shadow: 0 0 16px rgba(14,165,233,0.7); }
    .c-btn.btn-active-amber { background: #f59e0b !important; box-shadow: 0 0 16px rgba(245,158,11,0.7); }
    .c-btn-end { background: #ef4444 !important; }

    /* Drawers & Modals */
    .drawer {
      position: fixed; bottom: 84px; left: 0; right: 0;
      background: rgba(24, 24, 27, 0.97); backdrop-filter: blur(12px);
      padding: 14px 16px; border-top: 1px solid #3f3f46; display: none;
      flex-direction: column; gap: 10px; z-index: 95;
    }
    .drawer input, .drawer select {
      padding: 8px 12px; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 8px; color: white; outline: none; font-size: 13px;
    }

    #recapModal {
      position: fixed; inset: 15% 10%; background: #18181b; border: 2px solid #ec4899;
      border-radius: 20px; display: none; flex-direction: column; padding: 20px;
      z-index: 1000; box-shadow: 0 0 30px rgba(236,72,153,0.3);
    }
    #recapList { flex: 1; overflow-y: auto; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .recap-item {
      background: #27272a; padding: 10px 14px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }

    /* Lobby */
    #lobbyModal {
      position: fixed; inset: 0; background: #09090b;
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 2000;
    }
    .lobby-card {
      background: #18181b; padding: 28px; border-radius: 20px;
      width: 100%; max-width: 330px; text-align: center; border: 1px solid #27272a;
    }
    .lobby-card input {
      width: 100%; height: 46px; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 12px; color: white; text-align: center; margin: 14px 0; outline: none; font-size: 15px;
    }
    .lobby-card button {
      width: 100%; height: 48px; border-radius: 24px; border: none;
      background: #22c55e; color: white; font-size: 16px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <div class="top-bar">
    <div class="room-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="roomTitle">...</span>
      <button class="btn-text" id="copyUrlBtn">Copy</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-text" id="recapBtn">🎬 Recap</button>

  <!-- Drawing Canvas -->
  <canvas id="doodleCanvas"></canvas>

  <!-- Dynamic Whispers Stream -->

  <!-- Live Dual-Language Subtitles & Translation Banner -->

        <button class="w-chip" id="langHiBtn" style="background: #27272a; color: #a1a1aa; padding: 2px 8px;">HI ➔ EN</button>

  </div>

  <!-- Main Synced Video Container -->
  <div id="mainVideoContainer">
    <video id="mainPlayer" playsinline src="https://d23dyxeqlo5psv.cloudfront.net/big_buck_bunny.mp4"></video>
    <div id="ytWrapper"><div id="ytPlayer"></div></div>

  <!-- Split-Screen Grid (For Call-Only Mode) -->

  <!-- Dual Draggable / Resizable PiP Tiles -->

  <!-- Drawer 1: Dual-PiP & Synced Watch Party Controls -->
  <div class="drawer" id="watchDrawer">

      <input type="text" id="videoUrlInput" placeholder="Paste YouTube Link or Direct MP4..." style="flex: 1;" />

  <!-- Reaction Recap Modal -->
  <div id="recapModal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="color: #ec4899; font-size: 16px;">🎬 Reaction Highlights</h3>
      <button class="btn-text" id="closeRecapBtn" style="color: #ef4444; font-size: 16px;">✕</button>
    </div>
    <div id="recapList"></div>
  </div>

  <!-- Bottom Control Dock -->

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + window.location.host);

    let myId = null, localStream = null, processedAudioTrack = null;
    let screenStream = null, isScreenSharing = false, isCamOff = false, isMuted = false;

    // Web Audio Variables
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null, micSource = null, hpFilter = null, whisperPeaking = null;
    let voiceCompressor = null, processedDest = null, analyser = null;
    let isWhisperAudioActive = false, isSpatialActive = false, isCoupleModeActive = false;
    let partnerPanner = null, ambientGainNode = null, ambientSourceNode = null;
    let leftBinauralOsc = null, rightBinauralOsc = null;

    // Canvas Doodle State
    const doodleCanvas = document.getElementById('doodleCanvas');
    const ctx = doodleCanvas.getContext('2d');
    let isDoodlingActive = false, isDrawingLocal = false, remoteLastPos = null;

    // Synced Video, Mode & YouTube State
    let ytPlayer = null, isYouTubeMode = false, ytReady = false, isSyncing = false;
    let isCouchMode = false, isFaceToFaceCall = false, lastReactionTime = 0;
    const reactionHistory = [];

    // DOM Elements
    const lobbyModal = document.getElementById('lobbyModal');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const joinLoungeBtn = document.getElementById('joinLoungeBtn');
    const roomTitle = document.getElementById('roomTitle');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const controlsBar = document.getElementById('controlsBar');
    const myVideo = document.getElementById('myVideo');
    const partnerVideo = document.getElementById('partnerVideo');
    const mainPlayer = document.getElementById('mainPlayer');
    const ytWrapper = document.getElementById('ytWrapper');
    const callGridWrapper = document.getElementById('callGridWrapper');
    const localPip = document.getElementById('localPip');
    const remotePip = document.getElementById('remotePip');
    const whisperContainer = document.getElementById('whisperContainer');
    const subtitleBanner = document.getElementById('subtitleBanner');
    const subSpeaker = document.getElementById('subSpeaker');
    const subTextOriginal = document.getElementById('subTextOriginal');
    const subTextTranslated = document.getElementById('subTextTranslated');
    const langEnBtn = document.getElementById('langEnBtn');
    const langHiBtn = document.getElementById('langHiBtn');

    // Controls Buttons
    const callModeToggleBtn = document.getElementById('callModeToggleBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const camFlipBtn = document.getElementById('camFlipBtn');
    const coupleModeBtn = document.getElementById('coupleModeBtn');
    const whisperAudioBtn = document.getElementById('whisperAudioBtn');
    const spatialAudioBtn = document.getElementById('spatialAudioBtn');
    const muteBtn = document.getElementById('muteBtn');
    const camToggleBtn = document.getElementById('camToggleBtn');
    const screenShareBtn = document.getElementById('screenShareBtn');
    const doodleBtn = document.getElementById('doodleBtn');
    const subsBtn = document.getElementById('subsBtn');
    const fileBeamBtn = document.getElementById('fileBeamBtn');
    const p2pFileInput = document.getElementById('p2pFileInput');
    const watchDrawerBtn = document.getElementById('watchDrawerBtn');
    const whisperDrawerBtn = document.getElementById('whisperDrawerBtn');
    const watchDrawer = document.getElementById('watchDrawer');
    const whisperDrawer = document.getElementById('whisperDrawer');
    const recapModal = document.getElementById('recapModal');
    const recapList = document.getElementById('recapList');
    const recapBtn = document.getElementById('recapBtn');
    const closeRecapBtn = document.getElementById('closeRecapBtn');
    const pipSysBtn = document.getElementById('pipSysBtn');

    // -------------------------------------------------------------
    camFlipBtn.onclick = async () => {
      if (!localStream || isCamOff) return alert('Enable camera first to flip.');

      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: currentFacingMode },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        }).catch(async () => {
          // Fallback if device has no exact facing mode label
          return await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode }
          });
        });

        const newVideoTrack = newStream.getVideoTracks()[0];
        const oldVideoTrack = localStream.getVideoTracks()[0];

        if (oldVideoTrack) {
          oldVideoTrack.stop();
          localStream.removeTrack(oldVideoTrack);
        }
        localStream.addTrack(newVideoTrack);

        // Mirror front camera, unmirror back camera
        if (currentFacingMode === 'user') {
          myVideo.classList.add('mirror-mode');
        } else {
          myVideo.classList.remove('mirror-mode');
        }
        myVideo.srcObject = localStream;

        // Hot-swap the outgoing video track across all peers without renegotiation
        Object.values(peers).forEach(pc => {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(newVideoTrack);
        });

        camFlipBtn.style.transform = 'rotate(180deg)';
        setTimeout(() => camFlipBtn.style.transform = 'none', 300);
      } catch (err) {
        console.warn('Camera flip error:', err);
        alert('Secondary camera could not be accessed or is unavailable on this device.');
      }
    };

    function drawPoint(pixelX, pixelY, isMove, color) {
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = color;
      if (!isMove) {
        ctx.beginPath();
        ctx.moveTo(pixelX, pixelY);
        ctx.lineTo(pixelX, pixelY);
        ctx.stroke();
      } else {
        ctx.lineTo(pixelX, pixelY);
        ctx.stroke();
      }
    }

    // -------------------------------------------------------------
    // 3. WHISPER AUDIO DSP, 3D SPATIAL & COUPLE MODE
    // -------------------------------------------------------------
    function initAudioGraph(stream) {
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      micSource = audioCtx.createMediaStreamSource(stream);

      hpFilter = audioCtx.createBiquadFilter();
      hpFilter.type = 'highpass';
      hpFilter.frequency.value = 120;

      whisperPeaking = audioCtx.createBiquadFilter();
      whisperPeaking.type = 'peaking';
      whisperPeaking.frequency.value = 3500;
      whisperPeaking.gain.value = 0;
      whisperPeaking.Q.value = 1.2;

      voiceCompressor = audioCtx.createDynamicsCompressor();
      voiceCompressor.threshold.value = -24;
      voiceCompressor.knee.value = 8;
      voiceCompressor.ratio.value = 4;
      voiceCompressor.attack.value = 0.005;
      voiceCompressor.release.value = 0.2;

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      processedDest = audioCtx.createMediaStreamDestination();

      micSource.connect(hpFilter);
      hpFilter.connect(whisperPeaking);
      whisperPeaking.connect(voiceCompressor);
      voiceCompressor.connect(analyser);
      voiceCompressor.connect(processedDest);

      processedAudioTrack = processedDest.stream.getAudioTracks()[0];

      ambientGainNode = audioCtx.createGain();
      ambientGainNode.gain.value = 0.0;
      ambientGainNode.connect(audioCtx.destination);

      startAcousticAnalyser();
    }

    function setupRemoteSpatialAudio(stream) {
      if (!audioCtx) return;
      try {
        const remoteSource = audioCtx.createMediaStreamSource(stream);
        partnerPanner = audioCtx.createPanner();
        partnerPanner.panningModel = 'HRTF';
        partnerPanner.distanceModel = 'inverse';
        partnerPanner.positionX.value = isSpatialActive ? 3.0 : 0.0;
        partnerPanner.positionY.value = 0.0;
        partnerPanner.positionZ.value = isSpatialActive ? -1.5 : -1.0;

        remoteSource.connect(partnerPanner);
        partnerPanner.connect(audioCtx.destination);
      } catch (err) {
        console.warn('Spatial routing notice:', err);
      }
    }

    function startThetaSoundscape() {
      if (!audioCtx || ambientSourceNode) return;
      const merger = audioCtx.createChannelMerger(2);
      leftBinauralOsc = audioCtx.createOscillator();
      rightBinauralOsc = audioCtx.createOscillator();
      leftBinauralOsc.frequency.value = 200;
      rightBinauralOsc.frequency.value = 206;

      const binGain = audioCtx.createGain();
      binGain.gain.value = 0.06;
      leftBinauralOsc.connect(merger, 0, 0);
      rightBinauralOsc.connect(merger, 0, 1);
      merger.connect(binGain);
      binGain.connect(ambientGainNode);

      leftBinauralOsc.start();
      rightBinauralOsc.start();
      ambientGainNode.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.5);
      ambientSourceNode = leftBinauralOsc;
    }

    function stopThetaSoundscape() {
      if (leftBinauralOsc) {
        try { leftBinauralOsc.stop(); rightBinauralOsc.stop(); } catch(e){}
        leftBinauralOsc = null; rightBinauralOsc = null; ambientSourceNode = null;
      }
      if (ambientGainNode && audioCtx) {
        ambientGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
      }
    }

    function playSoftChime(freq = 1800) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {}
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '100%', width: '100%',
        playerVars: { autoplay: 1, controls: 1, rel: 0, playsinline: 1 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (e) => {
            if (isSyncing) return;
            if (e.data === YT.PlayerState.PLAYING) {
              playPauseBtn.innerText = '❚❚';
              broadcastData({ type: 'VIDEO_SYNC', action: 'play', time: ytPlayer.getCurrentTime(), isYT: true });
            } else if (e.data === YT.PlayerState.PAUSED) {
              playPauseBtn.innerText = '▶';
              broadcastData({ type: 'VIDEO_SYNC', action: 'pause', time: ytPlayer.getCurrentTime(), isYT: true });
            }
          }
        }
      });
    };

    loadVideoBtn.onclick = () => {

      if (!url) return;
      const ytId = extractYouTubeId(url);
      if (ytId) {
        loadYouTubeVideo(ytId);
        broadcastData({ type: 'LOAD_MEDIA', url, isYT: true, ytId });
      } else {
        loadNativeVideo(url);

    function startAcousticAnalyser() {
      if (!analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      setInterval(() => {
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        const avg = sum / data.length;
        const now = Date.now();

        if (avg > 75 && now - lastReactionTime > 3000) {
          lastReactionTime = now;
          let rType = 'gasp';
          if (avg > 92) rType = 'scream';
          else if (avg > 80) rType = 'laugh';

          triggerReactionUI(rType, 'You');
          broadcastData({ type: 'REACTION_BURST', rType });
        }
      }, 200);
    }

    // -------------------------------------------------------------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null, isSubtitlesActive = false, shouldKeepListening = false;
    let currentSourceLang = 'en-US', currentTargetLang = 'hi', translationTimeout = null;
    const translationCache = new Map();

    async function fetchTranslation(text, srcCode, tgtCode) {
      if (!text || text.trim().length === 0) return '';
      const key = `${srcCode}_${tgtCode}_${text.trim()}`;
      if (translationCache.has(key)) return translationCache.get(key);

      try {
        const s = srcCode.startsWith('hi') ? 'hi' : 'en';
        const t = tgtCode;
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
          const resText = data[0].map(item => item[0]).join('');
          translationCache.set(key, resText);
          return resText;
        }
      } catch (e) {
        console.warn('Translation fetch fallback notice:', e);
      }
      return '';
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = currentSourceLang;

      recognition.onresult = (e) => {
        let interimText = '';
        let finalText = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
          else interimText += e.results[i][0].transcript;
        }
        const live = (finalText || interimText).trim();
        if (live.length > 0) {
          showSubtitleDisplay("You Speaking", live, "Translating...");
          clearTimeout(translationTimeout);
          translationTimeout = setTimeout(async () => {
            const trans = await fetchTranslation(live, currentSourceLang, currentTargetLang);
            showSubtitleDisplay("You Speaking", live, trans);
            broadcastData({ type: 'BILINGUAL_SUBTITLE', speaker: 'Partner', original: live, translated: trans });
          }, 250);
        }
      };

      recognition.onend = () => {
        if (shouldKeepListening && isSubtitlesActive) {
          try { recognition.start(); } catch (err) {}
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') stopSubtitles();
      };
    }

    langEnBtn.onclick = () => switchLanguage('en-US', 'hi');
    langHiBtn.onclick = () => switchLanguage('hi-IN', 'en');

    function switchLanguage(srcLang, tgtLang) {
      currentSourceLang = srcLang;
      currentTargetLang = tgtLang;

      if (srcLang === 'en-US') {
        langEnBtn.style.background = '#ec4899';
        langEnBtn.style.color = '#fff';
        langHiBtn.style.background = '#27272a';
        langHiBtn.style.color = '#a1a1aa';
      } else {
        langHiBtn.style.background = '#ec4899';
        langHiBtn.style.color = '#fff';
        langEnBtn.style.background = '#27272a';
        langEnBtn.style.color = '#a1a1aa';
      }

      if (isSubtitlesActive && recognition) {
        shouldKeepListening = false;
        recognition.stop();
        setTimeout(() => {
          recognition.lang = currentSourceLang;
          shouldKeepListening = true;
          recognition.start();
        }, 200);
      }
    }

    subsBtn.onclick = () => {
      if (!SpeechRecognition) return alert("Speech recognition requires Chrome or Edge on HTTPS.");
      if (!isSubtitlesActive) startSubtitles();
      else stopSubtitles();
    };

    function startSubtitles() {
      shouldKeepListening = true;
      isSubtitlesActive = true;
      try {
        recognition.lang = currentSourceLang;
        recognition.start();
      } catch (e) {}
      subsBtn.classList.add('btn-active-amber');
      subtitleBanner.style.display = 'block';
      subSpeaker.innerText = "You Speaking";
      subTextOriginal.innerText = "Listening...";
      subTextTranslated.innerText = "";
    }

    function stopSubtitles() {
      shouldKeepListening = false;
      isSubtitlesActive = false;
      try { recognition.stop(); } catch (e) {}
      subsBtn.classList.remove('btn-active-amber');
      subtitleBanner.style.display = 'none';
    }

    function showSubtitleDisplay(speaker, orig, trans) {
      subtitleBanner.style.display = 'block';
      subSpeaker.innerText = speaker;
      subSpeaker.style.color = speaker.startsWith('You') ? '#38bdf8' : '#ec4899';
      subTextOriginal.innerText = orig;
      subTextTranslated.innerText = trans || '';
      clearTimeout(window.subHideTimeout);
      window.subHideTimeout = setTimeout(() => {
        if (!isSubtitlesActive) subtitleBanner.style.display = 'none';
        else {
          subTextOriginal.innerText = "Listening...";
          subTextTranslated.innerText = "";
        }
      }, 4500);
    }

    // -------------------------------------------------------------
    // 10. SCREEN SHARING & 1GB P2P FILE BEAM
    // -------------------------------------------------------------
    screenShareBtn.onclick = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        return alert("Screen sharing is supported on desktop browsers.");
      }

      if (!isScreenSharing) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" } });
          const track = screenStream.getVideoTracks()[0];

          Object.values(peers).forEach(pc => {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) sender.replaceTrack(track);
            else pc.addTrack(track, localStream);
          });

          myVideo.srcObject = screenStream;
          myVideo.classList.remove('mirror-mode');
          myVideo.style.display = 'block';
          const avatar = localPip.querySelector('.audio-avatar');
          if (avatar) avatar.remove();

          screenShareBtn.classList.add('btn-active-blue');
          isScreenSharing = true;

          track.onended = () => stopScreenShare();
        } catch (err) {
          if (err.name !== 'NotAllowedError') console.error(err);
        }
      } else {
        stopScreenShare();
      }
    };

    function stopScreenShare() {
      if (!isScreenSharing) return;
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
      }
      const camTrack = localStream ? localStream.getVideoTracks()[0] : null;
      Object.values(peers).forEach(pc => {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) sender.replaceTrack(camTrack || null);
      });
      if (currentFacingMode === 'user') myVideo.classList.add('mirror-mode');
      updateLocalVideoUI();
      screenShareBtn.classList.remove('btn-active-blue');
      isScreenSharing = false;
    }

    fileBeamBtn.onclick = () => p2pFileInput.click();
    p2pFileInput.onchange = () => {
      const file = p2pFileInput.files[0];
      if (!file) return;

      const firstChan = Object.values(dataChannels)[0];
      if (!firstChan || firstChan.readyState !== 'open') return alert('Partner not connected yet.');

      const CHUNK_SIZE = 64 * 1024;
      let offset = 0;
      firstChan.bufferedAmountLowThreshold = 256 * 1024;
      firstChan.send(JSON.stringify({ type: 'FILE_START', name: file.name, size: file.size, mime: file.type }));

      function pump() {
        while (offset < file.size) {
          if (firstChan.bufferedAmount > firstChan.bufferedAmountLowThreshold) {
            firstChan.onbufferedamountlow = () => {
              firstChan.onbufferedamountlow = null;
              pump();
            };
            return;
          }
          const slice = file.slice(offset, offset + CHUNK_SIZE);
          const reader = new FileReader();
          reader.onload = (e) => {
            firstChan.send(e.target.result);
            offset += CHUNK_SIZE;
            pump();
          };
          reader.readAsArrayBuffer(slice);
          return;
        }
        firstChan.send(JSON.stringify({ type: 'FILE_END' }));
        alert('File Beam finished sending!');
      }
      pump();
    };

    let incomingMeta = null, incomingChunks = [];

    // -------------------------------------------------------------
    // 11. WEBRTC SIGNALING & DATA CHANNELS
    // -------------------------------------------------------------
    function broadcastData(obj) {
      const payload = JSON.stringify(obj);
      Object.values(dataChannels).forEach(dc => {
        if (dc.readyState === 'open') dc.send(payload);
      });
    }

    function setupChannel(id, dc) {
      dc.binaryType = 'arraybuffer';
      dataChannels[id] = dc;
      dc.onmessage = (e) => {
        if (typeof e.data !== 'string') {
          incomingChunks.push(e.data);
          return;
        }

        const m = JSON.parse(e.data);

        if (m.type === 'BILINGUAL_SUBTITLE') {
          showSubtitleDisplay(m.speaker, m.original, m.translated);
        } else if (m.type === 'WHISPER_FLOAT') {
          postWhisper(m.text, false);
        } else if (m.type === 'SECRET_WHISPER_STEAM') {
          renderSteamySecretBubble(m.text);
        } else if (m.type === 'DOODLE_STROKE') {
          const targetX = m.x * window.innerWidth;
          const targetY = m.y * window.innerHeight;
          if (m.state === 'start') {
            remoteLastPos = { x: targetX, y: targetY };
            drawPoint(targetX, targetY, false, m.color || '#38bdf8');
          } else if (m.state === 'move') {
            if (!remoteLastPos) ctx.beginPath();
            drawPoint(targetX, targetY, true, m.color || '#38bdf8');
            remoteLastPos = { x: targetX, y: targetY };
          } else if (m.state === 'end') {
            ctx.beginPath();
            remoteLastPos = null;
          }
        } else if (m.type === 'LOAD_MEDIA') {
          if (m.isYT && m.ytId) loadYouTubeVideo(m.ytId);
          else loadNativeVideo(m.url);
        } else if (m.type === 'VIDEO_SYNC') {
          isSyncing = true;
          if (m.isYT && ytPlayer && ytReady) {
            if (m.action === 'play') {
              if (Math.abs(ytPlayer.getCurrentTime() - m.time) > 0.4) ytPlayer.seekTo(m.time, true);
              ytPlayer.playVideo();
              playPauseBtn.innerText = '❚❚';
            } else if (m.action === 'pause') {
              ytPlayer.pauseVideo();
              playPauseBtn.innerText = '▶';
            } else if (m.action === 'seek') {
              ytPlayer.seekTo(m.time, true);
            }
          } else if (!m.isYT && mainPlayer) {
            if (m.action === 'play') {
              if (Math.abs(mainPlayer.currentTime - m.time) > 0.3) mainPlayer.currentTime = m.time;
              mainPlayer.play().catch(()=>{});
              playPauseBtn.innerText = '❚❚';
            } else if (m.action === 'pause') {
              mainPlayer.pause();
              playPauseBtn.innerText = '▶';
            } else if (m.action === 'seek') {
              mainPlayer.currentTime = m.time;
            }
          }
          setTimeout(() => { isSyncing = false; }, 350);
        } else if (m.type === 'VIDEO_RATE') {
          if (m.isYT && ytPlayer && ytReady) ytPlayer.setPlaybackRate(m.rate);
          else mainPlayer.playbackRate = m.rate;
          rateSelect.value = m.rate.toString();
        } else if (m.type === 'LAYOUT_MODE_TOGGLE') {
          toggleCallOnlyMode(m.isCallOnly);
        } else if (m.type === 'COUPLE_MODE_SYNC') {
          applyCoupleMode(m.enabled);
        } else if (m.type === 'REACTION_BURST') {
          triggerReactionUI(m.rType, 'Partner');
        } else if (m.type === 'REMOTE_CAM_STATE') {
          updateRemoteVideoUI(m.enabled);
        } else if (m.type === 'FILE_START') {
          incomingMeta = m; incomingChunks = [];
        } else if (m.type === 'FILE_END') {
          const blob = new Blob(incomingChunks, { type: incomingMeta.mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = incomingMeta.name; a.click();
          alert(`Received File: ${incomingMeta.name}`);
        }
      };
    }

    ws.onmessage = async (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'room-info') {
        myId = data.myId;
        data.peers.forEach(pId => createPeer(pId, true));
      } else if (data.type === 'offer') {
        const pc = createPeer(data.sender, false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        ws.send(JSON.stringify({ target: data.sender, type: 'answer', payload: ans }));
      } else if (data.type === 'answer') {
        const pc = peers[data.sender];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
      } else if (data.type === 'candidate') {
        const pc = peers[data.sender];
        if (pc && data.payload) pc.addIceCandidate(new RTCIceCandidate(data.payload));
      } else if (data.type === 'peer-left') {
        if (peers[data.peerId]) { peers[data.peerId].close(); delete peers[data.peerId]; }
        partnerVideo.srcObject = null;
      }
    };

    function createPeer(peerId, isInit) {
      const pc = new RTCPeerConnection(rtcConfig);
      peers[peerId] = pc;

      if (processedAudioTrack) pc.addTrack(processedAudioTrack, localStream);
      if (localStream) localStream.getVideoTracks().forEach(t => pc.addTrack(t, localStream));

      if (isInit) {
        const dc = pc.createDataChannel('masterChannel');
        setupChannel(peerId, dc);
        pc.onnegotiationneeded = async () => {
          const off = await pc.createOffer();
          await pc.setLocalDescription(off);
          ws.send(JSON.stringify({ target: peerId, type: 'offer', payload: off }));
        };
      } else {
        pc.ondatachannel = (e) => setupChannel(peerId, e.channel);
      }

      pc.ontrack = (evt) => {
        partnerVideo.srcObject = evt.streams[0];
        updateRemoteVideoUI(evt.streams[0].getVideoTracks().length > 0);
        if (!remoteAudioStreams[peerId]) {
          remoteAudioStreams[peerId] = true;
          setupRemoteSpatialAudio(evt.streams[0]);
        }
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) ws.send(JSON.stringify({ target: peerId, type: 'candidate', payload: e.candidate }));
      };

      return pc;
    }

    // -------------------------------------------------------------
    // 12. INITIALIZATION & HARDWARE ERROR RECOVERY
    // -------------------------------------------------------------
    function updateLocalVideoUI() {
      const hasLiveVideo = localStream && localStream.getVideoTracks().length > 0 && !isCamOff;
      if (hasLiveVideo) {
        myVideo.style.display = 'block';
        myVideo.srcObject = localStream;
        const avatar = localPip.querySelector('.audio-avatar');
        if (avatar) avatar.remove();
        camToggleBtn.innerText = '📹';
        camToggleBtn.style.background = '#27272a';
      } else {
        myVideo.style.display = 'none';
        if (!localPip.querySelector('.audio-avatar')) {
          const avatar = document.createElement('div');
          avatar.className = 'audio-avatar';
          avatar.innerHTML = `<span style="font-size:32px;">🎙️</span><span style="font-size:11px; color:#a1a1aa; margin-top:4px;">Audio Only</span>`;
          localPip.appendChild(avatar);
        }
        camToggleBtn.innerText = '🙈';
        camToggleBtn.style.background = '#f59e0b';
      }
    }

    function updateRemoteVideoUI(hasVideo) {
      if (hasVideo) {
        partnerVideo.style.display = 'block';
        const avatar = remotePip.querySelector('.audio-avatar');
        if (avatar) avatar.remove();
      } else {
        partnerVideo.style.display = 'none';
        if (!remotePip.querySelector('.audio-avatar')) {
          const avatar = document.createElement('div');
          avatar.className = 'audio-avatar';
          avatar.innerHTML = `<span style="font-size:32px;">👤</span><span style="font-size:11px; color:#a1a1aa; margin-top:4px;">Audio Only</span>`;
          remotePip.appendChild(avatar);
        }
      }
    }

    joinLoungeBtn.onclick = async () => {
      room = roomCodeInput.value.trim().toLowerCase().replace(/\s+/g, '-') || 'suite-room';
      window.location.hash = room;
      roomTitle.innerText = room;

      const wantsVideo = document.querySelector('input[name="callMode"]:checked').value === 'video';
      isCamOff = !wantsVideo;

      try {
        if (wantsVideo) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
              video: {
                facingMode: currentFacingMode,
                width: { ideal: 640 },
                height: { ideal: 480 }
              }
            });
          } catch (camErr) {
            console.warn("Camera fallback applied:", camErr);
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
              video: false
            });
            isCamOff = true;
            alert("Camera inaccessible. Entered in Audio-Only mode.");
          }
        } else {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true },
            video: false
          });
        }

        initAudioGraph(localStream);
        updateLocalVideoUI();

        lobbyModal.style.display = 'none';
        controlsBar.style.display = 'flex';

        ws.send(JSON.stringify({ room, type: 'join' }));
      } catch (err) {
        alert('Microphone permission required: ' + err.message);
      }
    };

    camToggleBtn.onclick = async () => {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];

      if (track) {
        isCamOff = !isCamOff;
        track.enabled = !isCamOff;
        updateLocalVideoUI();
        broadcastData({ type: 'REMOTE_CAM_STATE', enabled: !isCamOff });
      } else {
        try {
          const s = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: currentFacingMode,
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          });
          const newTrack = s.getVideoTracks()[0];
          localStream.addTrack(newTrack);

          Object.values(peers).forEach(pc => {
            const sender = pc.getSenders().find(x => x.track && x.track.kind === 'video');
            if (sender) sender.replaceTrack(newTrack);
            else pc.addTrack(newTrack, localStream);
          });

          isCamOff = false;
          updateLocalVideoUI();
          broadcastData({ type: 'REMOTE_CAM_STATE', enabled: true });
        } catch (err) {
          alert('Could not start camera: ' + err.message);
        }
      }
    };

    muteBtn.onclick = () => {
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      if (processedAudioTrack) processedAudioTrack.enabled = !isMuted;
      muteBtn.style.background = isMuted ? '#f59e0b' : '#27272a';
    };

    watchDrawerBtn.onclick = () => {
      const isHidden = watchDrawer.style.display !== 'flex';
      watchDrawer.style.display = isHidden ? 'flex' : 'none';
      whisperDrawer.style.display = 'none';
    };

    copyUrlBtn.onclick = () => {
      navigator.clipboard.writeText(window.location.origin + '/#' + room).then(() => {
        copyUrlBtn.innerText = 'Copied!';
        setTimeout(() => copyUrlBtn.innerText = 'Copy', 2000);
      });
    };

    pipSysBtn.onclick = async () => {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (mainPlayer && !isYouTubeMode) await mainPlayer.requestPictureInPicture();
      else alert("System PiP operates on native MP4 video playback.");
    };

    hangupBtn.onclick = () => {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      location.reload();
    };
  </script>
</body>

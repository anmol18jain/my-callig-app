<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Lounge Suite</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#09090b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="https://emojicdn.elk.sh/🛋️?style=apple" />

  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --card-glass: rgba(18, 18, 21, 0.82);
      --border: #232328;
      --border-focus: #3b82f6;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.4);
      --pink: #ec4899;
      --amber: #f59e0b;
      --red: #ef4444;
      --red-hover: #dc2626;
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-bar {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--card-glass);
      backdrop-filter: blur(16px);
      z-index: 60;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      background: var(--card);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-pill:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    /* Video Workspace */
    .viewport-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #mainVideoContainer {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }

    #mainPlayer, #ytPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #ytWrapper {
      width: 100%;
      height: 100%;
      display: none;
    }

    /* Grid Stage */
    #videoMeshGrid {
      position: absolute;
      inset: 0;
      padding: 10px;
      display: none;
      gap: 10px;
      z-index: 25;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .video-tile {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #121215;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-tile video.mirror {
      transform: scaleX(-1);
    }

    .tile-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Picture-in-Picture Panels */
    .pip-box {
      position: absolute;
      width: 120px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      background: #18181b;
      border: 2px solid #3f3f46;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 45;
      cursor: grab;
      touch-action: none;
      transition: border-color 0.2s ease;
    }

    .pip-box:hover {
      border-color: #38bdf8;
    }

    .pip-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .pip-box video.mirror-mode {
      transform: scaleX(-1);
    }

    .pip-label {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      z-index: 2;
    }

    /* Diagnostics Badge */
    #diagStatus {
      position: fixed;
      bottom: 84px;
      left: 12px;
      font-size: 11px;
      background: rgba(18, 18, 22, 0.85);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 8px;
      color: #38bdf8;
      z-index: 99;
      pointer-events: none;
      font-family: monospace;
    }

    /* Modern Control Dock */
    .controls-dock {
      height: 72px;
      padding: 0 16px max(10px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--card-glass);
      border-top: 1px solid var(--border);
      z-index: 60;
      backdrop-filter: blur(20px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .controls-dock::-webkit-scrollbar {
      display: none;
    }

    .c-btn {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .c-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .c-btn:hover {
      background: #1e1e24;
      border-color: #3f3f46;
      transform: translateY(-2px);
    }

    .c-btn:active {
      transform: scale(0.92);
    }

    .c-btn.active-blue {
      background: #0284c7 !important;
      border-color: #38bdf8 !important;
      color: #fff;
    }

    .c-btn.active-pink {
      background: var(--pink) !important;
      border-color: #f472b6 !important;
      color: #fff;
    }

    .c-btn.active-amber {
      background: #d97706 !important;
      border-color: #fbbf24 !important;
      color: #fff;
    }

    .c-btn-end {
      background: var(--red) !important;
      border-color: var(--red) !important;
      color: #fff;
    }

    .c-btn-end:hover {
      background: var(--red-hover) !important;
    }

    .badge-counter {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background: var(--pink);
      border-radius: 50%;
      font-size: 10px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    /* Contacts Directory Screen */
    #contactsScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      max-width: 680px;
      margin: 0 auto;
    }

    .contacts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .contact-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .contact-card:hover {
      border-color: #3f3f46;
      background: #17171c;
    }

    .contact-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .contact-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .contact-dot.online {
      background: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    .call-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-call-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .action-call-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }

    .action-call-btn:active {
      transform: scale(0.92);
    }

    .btn-audio-call {
      background: #27272a;
      color: #fff;
    }

    .btn-audio-call:hover {
      background: #3f3f46;
    }

    .btn-video-call {
      background: var(--green);
      color: #fff;
    }

    .btn-video-call:hover {
      background: #16a34a;
    }

    /* Slide Drawers & Modals */
    #chatDrawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 380px;
      background: #111114;
      border-left: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #chatDrawer.open {
      transform: translateX(0);
    }

    .chat-header {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .chat-mine {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-theirs {
      align-self: flex-start;
      background: #27272a;
      color: #f4f4f5;
      border-bottom-left-radius: 4px;
    }

    .chat-input-bar {
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: #18181b;
    }

    .chat-input {
      flex: 1;
      height: 42px;
      background: #27272a;
      border: 1px solid var(--border);
      border-radius: 21px;
      color: white;
      padding: 0 16px;
      font-size: 14px;
      outline: none;
    }

    .chat-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Incoming Call Fullscreen Modal */
    #incomingCallModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.96);
      backdrop-filter: blur(24px);
      z-index: 4000;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 60px 20px;
    }

    .pulse-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #18181b;
      border: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      animation: callPulse 1.5s infinite;
    }

    @keyframes callPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.6); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 24px rgba(99, 102, 241, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    .app-popup-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      z-index: 3500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 22px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .popup-box input {
      width: 100%;
      height: 44px;
      background: #27272a;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      text-align: center;
      margin: 16px 0;
      outline: none;
      font-size: 15px;
      font-weight: 600;
    }

    .popup-box button {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="status-pill">
      <span id="selfStatusDot" class="status-dot"></span>
      <span id="callSessionTitle">Connecting...</span>
    </div>
    <div class="nav-actions">
      <button class="btn-pill" id="pipSysBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="9" width="8" height="6" rx="1"/></svg>
        PiP
      </button>
      <button class="btn-pill" id="switchUserBtn">Switch User</button>
    </div>
  </div>

  <div class="viewport-container">
    <div id="mainVideoContainer">
      <video id="mainPlayer" playsinline src="https://d23dyxeqlo5psv.cloudfront.net/big_buck_bunny.mp4"></video>
      <div id="ytWrapper"><div id="ytPlayer"></div></div>
    </div>

    <div id="videoMeshGrid">
      <div class="video-tile" id="myVideoTile">
        <video id="myMeshVideo" class="mirror" autoplay playsinline muted></video>
        <span class="tile-label">You</span>
      </div>
    </div>

    <!-- Floating Picture-in-Picture Views -->
    <div class="pip-box" id="localPip" style="top: 20px; right: 16px;">
      <video id="myVideo" class="mirror-mode" autoplay playsinline muted></video>
      <span class="pip-label">You</span>
    </div>

    <div class="pip-box" id="remotePip" style="top: 20px; left: 16px;">
      <video id="partnerVideo" autoplay playsinline></video>
      <span class="pip-label" id="partnerPipLabel">Waiting...</span>
    </div>

    <div id="diagStatus">Signal: Ready</div>
  </div>

  <!-- Full-featured In-Call Floating Dock -->
  <div class="controls-dock" id="controlsDock">
    <button class="c-btn" id="camToggleBtn" title="Toggle Camera">
      <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    </button>
    <button class="c-btn" id="camFlipBtn" title="Flip Camera">
      <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    </button>
    <button class="c-btn" id="muteMicBtn" title="Mute Microphone">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="c-btn" id="callModeToggleBtn" title="Toggle Grid View">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </button>
    <button class="c-btn" id="chatBtn" title="Open Chat">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="badge-counter" id="chatBadge">0</span>
    </button>
    <button class="c-btn c-btn-end" id="hangupBtn" title="End Call">
      <svg viewBox="0 0 24 24" style="transform: rotate(135deg);"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
  </div>

  <!-- Contacts & Device Selection -->
  <div id="contactsScreen">
    <div class="contacts-header">
      <div class="user-profile-badge">
        <div class="user-avatar" id="myAvatarDisplay">👤</div>
        <div>
          <div style="font-size: 16px; font-weight: 700;" id="myUsernameDisplay">Connecting...</div>
          <div style="font-size: 11px; color: var(--green);">● Online & Ready</div>
        </div>
      </div>
      <button class="btn-pill" id="openAddContactBtn" style="color: var(--green); border-color: var(--green);">+ Add Contact</button>
    </div>

    <div style="font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px;">
      Direct Contacts
    </div>

    <div id="contactsListContainer" style="flex: 1; overflow-y: auto;"></div>
  </div>

  <!-- Chat Drawer -->
  <div id="chatDrawer">
    <div class="chat-header">
      <div style="font-size: 14px; font-weight: 600;">Lounge Chat</div>
      <button class="btn-pill" id="closeChatBtn" style="color: var(--red); border: none;">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div style="text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 15px;">
        End-to-end direct WebRTC data stream.
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." />
      <button id="sendChatBtn" class="chat-send-btn">➤</button>
    </div>
  </div>

  <!-- Incoming Call Ringing Overlay -->
  <div id="incomingCallModal">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div class="pulse-avatar">👤</div>
      <h2 id="incomingCallerName" style="font-size: 24px; font-weight: 700;">Caller</h2>
      <p id="incomingCallType" style="font-size: 13px; color: var(--text-dim);">Incoming Call...</p>
    </div>
    <div style="display: flex; gap: 48px; align-items: center;">
      <button id="declineCallBtn" style="width: 68px; height: 68px; border-radius: 50%; border: none; background: var(--red); color: white; font-size: 24px; cursor: pointer;">✕</button>
      <button id="acceptCallBtn" style="width: 68px; height: 68px; border-radius: 50%; border: none; background: var(--green); color: white; font-size: 24px; cursor: pointer;">📞</button>
    </div>
  </div>

  <!-- Add Contact Dialog -->
  <div class="app-popup-modal" id="addPersonModal">
    <div class="popup-box">
      <h3 style="font-size: 18px; font-weight: 700;">Add Contact</h3>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Enter the exact username of the device</p>
      <input type="text" id="newPersonInput" placeholder="e.g. Phone, Laptop, Sarah" />
      <div style="display: flex; gap: 10px;">
        <button id="cancelAddPersonBtn" style="background: #27272a; flex: 1;">Cancel</button>
        <button id="savePersonBtn" style="background: var(--accent); flex: 1;">Save</button>
      </div>
    </div>
  </div>

  <!-- First Login Identity Dialog -->
  <div class="app-popup-modal" id="loginModal">
    <div class="popup-box">
      <h2 style="font-size: 20px; font-weight: 700;">Set Device Name</h2>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Identifies this device to receive calls</p>
      <input type="text" id="loginUsernameInput" placeholder="e.g. Laptop or Phone" />
      <button id="saveUsernameBtn">Continue</button>
    </div>
  </div>

  <audio id="ringtoneAudio" loop src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg"></audio>
  <audio id="remoteAudioSink" autoplay playsinline></audio>

  <!-- Complete WebRTC, Presence & Push Engine -->
  <script>
    // Paste your Web Push public key here (leave placeholder if testing without push)
    const VAPID_PUBLIC_KEY = 'PASTE_YOUR_PUBLIC_KEY_HERE';

    // In-app diagnostic status
    const diagStatus = document.getElementById('diagStatus');
    function setDiag(msg) {
      if (diagStatus) diagStatus.innerText = msg;
      console.log(`[Diagnostic] ${msg}`);
    }

    // Identity Management
    let myUsername = localStorage.getItem('lounge_username');
    if (!myUsername) {
      myUsername = /Mobile|Android/i.test(navigator.userAgent) ? 'Phone' : 'Laptop';
      localStorage.setItem('lounge_username', myUsername);
    }

    let myContacts = JSON.parse(localStorage.getItem('lounge_saved_contacts')) || ['Laptop', 'Phone'];
    myContacts = myContacts.filter(c => c && c.toLowerCase() !== myUsername.toLowerCase());
    localStorage.setItem('lounge_saved_contacts', JSON.stringify(myContacts));

    let ws = null;
    let wsReconnectTimer = null;
    let localStream = null;
    let activePeer = null;
    let isAudioOnly = false;
    let isCamOff = false;
    let isMuted = false;
    let isFaceToFace = false;
    let currentFacingMode = 'user';

    const peerConnections = {};
    const dataChannels = {};
    const iceCandidateQueues = {};

    // STUN + OpenRelay TURN for instant bypass of 4G/CGNAT
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ],
      iceCandidatePoolSize: 10
    };

    // DOM References
    const contactsScreen = document.getElementById('contactsScreen');
    const contactsListContainer = document.getElementById('contactsListContainer');
    const myUsernameDisplay = document.getElementById('myUsernameDisplay');
    const myAvatarDisplay = document.getElementById('myAvatarDisplay');
    const openAddContactBtn = document.getElementById('openAddContactBtn');
    const addPersonModal = document.getElementById('addPersonModal');
    const newPersonInput = document.getElementById('newPersonInput');
    const savePersonBtn = document.getElementById('savePersonBtn');
    const cancelAddPersonBtn = document.getElementById('cancelAddPersonBtn');
    const loginModal = document.getElementById('loginModal');
    const loginUsernameInput = document.getElementById('loginUsernameInput');
    const saveUsernameBtn = document.getElementById('saveUsernameBtn');
    const switchUserBtn = document.getElementById('switchUserBtn');
    const controlsDock = document.getElementById('controlsDock');
    const callSessionTitle = document.getElementById('callSessionTitle');
    const selfStatusDot = document.getElementById('selfStatusDot');
    const incomingCallModal = document.getElementById('incomingCallModal');
    const incomingCallerName = document.getElementById('incomingCallerName');
    const incomingCallType = document.getElementById('incomingCallType');
    const acceptCallBtn = document.getElementById('acceptCallBtn');
    const declineCallBtn = document.getElementById('declineCallBtn');
    const ringtoneAudio = document.getElementById('ringtoneAudio');
    const remoteAudioSink = document.getElementById('remoteAudioSink');
    const myVideo = document.getElementById('myVideo');
    const partnerVideo = document.getElementById('partnerVideo');
    const myMeshVideo = document.getElementById('myMeshVideo');
    const mainVideoContainer = document.getElementById('mainVideoContainer');
    const videoMeshGrid = document.getElementById('videoMeshGrid');
    const localPip = document.getElementById('localPip');
    const remotePip = document.getElementById('remotePip');
    const camToggleBtn = document.getElementById('camToggleBtn');
    const camFlipBtn = document.getElementById('camFlipBtn');
    const muteMicBtn = document.getElementById('muteMicBtn');
    const callModeToggleBtn = document.getElementById('callModeToggleBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const chatBtn = document.getElementById('chatBtn');
    const chatDrawer = document.getElementById('chatDrawer');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const chatBadge = document.getElementById('chatBadge');
    let unreadCount = 0;
    let isChatOpen = false;

    // 1. SIGNALING CONNECTION
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        setDiag("Signal: Connected");
        selfStatusDot.classList.remove('offline');
        callSessionTitle.innerText = `${myUsername} (Ready)`;
        if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        registerServer();

        // Keep-alive heartbeat (Render 55s timeout protection)
        setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'ping' }));
          }
        }, 20000);
      };

      ws.onmessage = async (e) => {
        const data = JSON.parse(e.data);

        // Update real-time online status
        if (data.type === 'presence_update') {
          renderContactsList(data.users);
        } else if (data.type === 'offer') {
          showIncomingCallScreen(data);
        } else if (data.type === 'answer') {
          const pc = peerConnections[data.from];
          if (pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            setDiag(`Connected to ${data.from}`);
            processIceQueue(data.from);
          }
        } else if (data.type === 'candidate') {
          const pc = peerConnections[data.from];
          const cand = new RTCIceCandidate(data.candidate);
          if (pc && pc.remoteDescription && pc.remoteDescription.type) {
            pc.addIceCandidate(cand).catch(() => {});
          } else {
            if (!iceCandidateQueues[data.from]) iceCandidateQueues[data.from] = [];
            iceCandidateQueues[data.from].push(cand);
          }
        } else if (data.type === 'hangup') {
          endCall(false);
        }
      };

      ws.onclose = () => {
        setDiag("Signal: Disconnected");
        selfStatusDot.classList.add('offline');
        callSessionTitle.innerText = "Reconnecting...";
        wsReconnectTimer = setTimeout(connectWebSocket, 2000);
      };
    }

    function registerServer() {
      if (ws && ws.readyState === WebSocket.OPEN && myUsername) {
        ws.send(JSON.stringify({ type: 'register', userId: myUsername }));
      }
    }

    // 2. CONTACTS & IDENTITY UI
    function setupUserIdentity() {
      myUsernameDisplay.innerText = myUsername;
      myAvatarDisplay.innerText = myUsername[0].toUpperCase();
      renderContactsList();
      registerServer();
    }

    let cachedOnlineList = [];
    function renderContactsList(onlineList = cachedOnlineList) {
      cachedOnlineList = onlineList;
      contactsListContainer.innerHTML = '';

      if (myContacts.length === 0) {
        contactsListContainer.innerHTML = `
          <div style="text-align:center; color:var(--text-dim); margin-top:40px; font-size:13px;">
            No contacts saved yet.<br>Tap <b>+ Add Contact</b> above.
          </div>`;
        return;
      }

      myContacts.forEach(name => {
        const isOnline = onlineList.some(u => u.toLowerCase() === name.toLowerCase());
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.innerHTML = `
          <div class="contact-info">
            <div class="contact-dot ${isOnline ? 'online' : ''}"></div>
            <div>
              <div style="font-size:15px; font-weight:600;">${name}</div>
              <div style="font-size:11px; color:${isOnline ? 'var(--green)' : 'var(--text-dim)'};">
                ${isOnline ? 'Online' : 'Offline'}
              </div>
            </div>
          </div>
          <div class="call-actions">
            <button class="action-call-btn btn-audio-call" title="Audio Call">
              <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
            </button>
            <button class="action-call-btn btn-video-call" title="Video Call">
              <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
            <button class="action-call-btn" style="background:none; color:#71717a;" title="Delete">✕</button>
          </div>
        `;
        card.querySelector('.btn-audio-call').onclick = () => startCall(name, true);
        card.querySelector('.btn-video-call').onclick = () => startCall(name, false);
        card.querySelector('button[title="Delete"]').onclick = () => removeContact(name);
        contactsListContainer.appendChild(card);
      });
    }

    function removeContact(name) {
      if (confirm(`Remove ${name}?`)) {
        myContacts = myContacts.filter(c => c !== name);
        localStorage.setItem('lounge_saved_contacts', JSON.stringify(myContacts));
        renderContactsList();
      }
    }

    openAddContactBtn.onclick = () => { newPersonInput.value = ''; addPersonModal.style.display = 'flex'; newPersonInput.focus(); };
    cancelAddPersonBtn.onclick = () => { addPersonModal.style.display = 'none'; };
    savePersonBtn.onclick = () => {
      const name = newPersonInput.value.trim();
      if (!name) return;
      if (name.toLowerCase() === myUsername.toLowerCase()) return alert("Cannot add yourself.");
      if (!myContacts.includes(name)) {
        myContacts.push(name);
        localStorage.setItem('lounge_saved_contacts', JSON.stringify(myContacts));
      }
      addPersonModal.style.display = 'none';
      renderContactsList();
    };

    switchUserBtn.onclick = () => { loginModal.style.display = 'flex'; loginUsernameInput.value = ''; };
    saveUsernameBtn.onclick = () => {
      const val = loginUsernameInput.value.trim();
      if (!val) return;
      myUsername = val;
      localStorage.setItem('lounge_username', myUsername);
      loginModal.style.display = 'none';
      setupUserIdentity();
    };

    // 3. HARDWARE & MEDIA INITIALIZATION
    async function startHardware(audioOnly) {
      try {
        if (!audioOnly) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
              video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
            });
          } catch {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            isAudioOnly = true;
          }
        } else {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        }

        if (localStream) {
          myVideo.srcObject = localStream;
          myMeshVideo.srcObject = localStream;
        }
      } catch (err) {
        alert("Microphone/Camera permission required for calling.");
      }
    }

    // 4. WEBRTC ENGINE (Fast Trickle ICE & TURN)
    function setupPeerConnection(peerName) {
      if (peerConnections[peerName]) return peerConnections[peerName];

      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[peerName] = pc;
      iceCandidateQueues[peerName] = [];

      pc.onicecandidate = (e) => {
        if (e.candidate && ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'candidate',
            target: peerName,
            candidate: e.candidate
          }));
        }
      };

      pc.ontrack = (evt) => {
        const stream = evt.streams[0] || new MediaStream([evt.track]);
        partnerVideo.srcObject = stream;
        partnerVideo.play().catch(() => {});
        remoteAudioSink.srcObject = stream;
        remoteAudioSink.play().catch(() => {});
        document.getElementById('partnerPipLabel').innerText = peerName;
      };

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      // Data Channel for In-Call Chat
      const dc = pc.createDataChannel('chatChannel');
      bindDataChannel(peerName, dc);
      pc.ondatachannel = (e) => bindDataChannel(peerName, e.channel);

      return pc;
    }

    function processIceQueue(peerName) {
      const pc = peerConnections[peerName];
      if (pc && iceCandidateQueues[peerName]) {
        for (const cand of iceCandidateQueues[peerName]) {
          pc.addIceCandidate(cand).catch(() => {});
        }
        iceCandidateQueues[peerName] = [];
      }
    }

    function bindDataChannel(peerName, dc) {
      dataChannels[peerName] = dc;
      dc.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'chat') {
          appendChatMessage(peerName, msg.text, false);
        }
      };
    }

    // 5. CALL ACTIONS
    async function startCall(target, audioOnly) {
      activePeer = target;
      isAudioOnly = audioOnly;

      setDiag(`Calling ${target}...`);
      await startHardware(isAudioOnly);
      if (!localStream) return;

      enterCallUI(target);
      const pc = setupPeerConnection(target);

      const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: !isAudioOnly });
      await pc.setLocalDescription(offer);

      ws.send(JSON.stringify({
        type: 'offer',
        target: target,
        offer: offer
      }));
    }

    let pendingOfferData = null;
    function showIncomingCallScreen(data) {
      pendingOfferData = data;
      incomingCallerName.innerText = data.from;
      incomingCallType.innerText = 'Incoming Call...';
      incomingCallModal.style.display = 'flex';
      ringtoneAudio.currentTime = 0;
      ringtoneAudio.play().catch(() => {});
    }

    acceptCallBtn.onclick = async () => {
      dismissRinging();
      if (!pendingOfferData) return;

      activePeer = pendingOfferData.from;
      await startHardware(false);
      if (!localStream) return;

      enterCallUI(activePeer);
      const pc = setupPeerConnection(activePeer);

      await pc.setRemoteDescription(new RTCSessionDescription(pendingOfferData.offer));
      processIceQueue(activePeer);

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      ws.send(JSON.stringify({
        type: 'answer',
        target: activePeer,
        answer: answer
      }));
    };

    declineCallBtn.onclick = () => {
      dismissRinging();
      pendingOfferData = null;
    };

    function dismissRinging() {
      incomingCallModal.style.display = 'none';
      ringtoneAudio.pause();
      ringtoneAudio.currentTime = 0;
    }

    function enterCallUI(title) {
      contactsScreen.style.display = 'none';
      controlsDock.style.display = 'flex';
      callSessionTitle.innerText = `In Call with ${title}`;
    }

    function endCall(notify = true) {
      if (notify && activePeer && ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'hangup', target: activePeer }));
      }

      Object.values(peerConnections).forEach(pc => pc.close());
      for (const k in peerConnections) delete peerConnections[k];

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      myVideo.srcObject = null;
      partnerVideo.srcObject = null;
      controlsDock.style.display = 'none';
      contactsScreen.style.display = 'flex';
      callSessionTitle.innerText = `${myUsername} (Ready)`;
      setDiag("Signal: Ready");
    }

    hangupBtn.onclick = () => endCall(true);

    // 6. HARDWARE TOGGLES
    camToggleBtn.onclick = () => {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        isCamOff = !isCamOff;
        track.enabled = !isCamOff;
        camToggleBtn.classList.toggle('active-amber', isCamOff);
      }
    };

    camFlipBtn.onclick = async () => {
      if (!localStream || isCamOff) return;
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
        const newTrack = stream.getVideoTracks()[0];
        const oldTrack = localStream.getVideoTracks()[0];
        if (oldTrack) { oldTrack.stop(); localStream.removeTrack(oldTrack); }
        localStream.addTrack(newTrack);
        myVideo.srcObject = localStream;
        Object.values(peerConnections).forEach(pc => {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(newTrack);
        });
      } catch (e) {
        console.error("Cam flip error:", e);
      }
    };

    muteMicBtn.onclick = () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      muteMicBtn.classList.toggle('active-amber', isMuted);
    };

    callModeToggleBtn.onclick = () => {
      isFaceToFace = !isFaceToFace;
      callModeToggleBtn.classList.toggle('active-blue', isFaceToFace);
      if (isFaceToFace) {
        mainVideoContainer.style.display = 'none';
        videoMeshGrid.style.display = 'grid';
        localPip.style.display = 'none';
        remotePip.style.display = 'none';
      } else {
        mainVideoContainer.style.display = 'flex';
        videoMeshGrid.style.display = 'none';
        localPip.style.display = 'block';
        remotePip.style.display = 'block';
      }
    };

    // 7. IN-CALL CHAT DRAWER
    chatBtn.onclick = () => {
      isChatOpen = !isChatOpen;
      chatDrawer.classList.toggle('open', isChatOpen);
      if (isChatOpen) {
        unreadCount = 0;
        chatBadge.style.display = 'none';
        chatInput.focus();
      }
    };
    closeChatBtn.onclick = () => {
      isChatOpen = false;
      chatDrawer.classList.remove('open');
    };

    sendChatBtn.onclick = sendChat;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      appendChatMessage('You', text, true);
      Object.values(dataChannels).forEach(dc => {
        if (dc.readyState === 'open') {
          dc.send(JSON.stringify({ type: 'chat', text }));
        }
      });
      chatInput.value = '';
    }

    function appendChatMessage(from, text, isMine) {
      const b = document.createElement('div');
      b.className = `chat-bubble ${isMine ? 'chat-mine' : 'chat-theirs'}`;
      b.innerText = `${!isMine ? from + ': ' : ''}${text}`;
      chatMessages.appendChild(b);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!isMine && !isChatOpen) {
        unreadCount++;
        chatBadge.innerText = unreadCount;
        chatBadge.style.display = 'flex';
      }
    }

    // 8. DRAGGABLE PIP LOGIC
    function makeDraggable(el) {
      let ox = 0, oy = 0, sx = 0, sy = 0;
      el.onpointerdown = (e) => {
        e.preventDefault();
        sx = e.clientX; sy = e.clientY;
        ox = el.offsetLeft; oy = el.offsetTop;
        window.onpointermove = (ev) => {
          el.style.left = (ox + ev.clientX - sx) + 'px';
          el.style.top = (oy + ev.clientY - sy) + 'px';
        };
        window.onpointerup = () => {
          window.onpointermove = null;
          window.onpointerup = null;
        };
      };
    }
    makeDraggable(localPip);
    makeDraggable(remotePip);

    // 9. BACKGROUND WEB PUSH REGISTRATION
    async function setupWebPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const perm = await Notification.requestPermission();
        if (perm === 'granted' && VAPID_PUBLIC_KEY !== 'PASTE_YOUR_PUBLIC_KEY_HERE') {
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY)
          });
          await fetch('/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: myUsername, subscription: sub })
          });
        }
      } catch (err) {
        console.warn('Web Push skipped/failed:', err);
      }
    }

    function urlB64ToUint8(base64String) {
      const pad = '='.repeat((4 - (base64String.length % 4)) % 4);
      const b64 = (base64String + pad).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(b64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      setupUserIdentity();
      connectWebSocket();
      setupWebPush();

      // Check if opened from background push notification
      const params = new URLSearchParams(window.location.search);
      const incoming = params.get('callFrom');
      if (incoming) {
        setTimeout(() => startCall(incoming, false), 800);
      }
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lounge Suite • Pure Audio</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #141417;
      --border: #27272a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #22c55e;
      --pink: #ec4899;
      --text: #f4f4f5;
      --text-dim: #71717a;
    }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    body {
      width: 100vw; height: 100dvh; background: var(--bg); color: var(--text);
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* Top Minimal Bar */
    .top-bar {
      height: 56px; padding: 0 18px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border);
      background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px); z-index: 40;
    }
    .room-pill {
      display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
      background: var(--card); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
    .btn-pill {
      background: none; border: 1px solid var(--border); color: #38bdf8;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .btn-pill:active { background: var(--border); }

    /* Central Soundstage / Voice Avatar Stage */
    .stage-container {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; position: relative; padding: 20px;
    }
    .peers-row {
      display: flex; align-items: center; justify-content: center;
      gap: 40px; flex-wrap: wrap; width: 100%; max-width: 600px;
    }
    .avatar-card {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      position: relative;
    }
    .avatar-disc {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #27272a, #141417);
      border: 2px solid var(--border); display: flex; align-items: center;
      justify-content: center; font-size: 40px; position: relative;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .avatar-disc.speaking {
      border-color: var(--accent);
      box-shadow: 0 0 35px var(--accent-glow);
      transform: scale(1.05);
    }
    .avatar-disc.partner-speaking {
      border-color: var(--pink);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.35);
      transform: scale(1.05);
    }
    .avatar-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .avatar-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
    }

    /* Frequency Wave Canvas */
    #waveCanvas {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 60px; pointer-events: none; opacity: 0.8;
    }

    /* Subtitles Banner (Streamlined, Accurate) */
    #subtitlesBanner {
      position: absolute; bottom: 105px; left: 20px; right: 20px;
      background: rgba(20, 20, 23, 0.88); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 18px; text-align: center;
      backdrop-filter: blur(16px); display: none; z-index: 30;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 600px; margin: 0 auto;
    }
    .sub-speaker { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
    .sub-text { font-size: 14px; font-weight: 500; color: #fef08a; line-height: 1.4; }

    /* Bottom Minimal Controls Bar */
    .controls-dock {
      height: 76px; padding: 0 16px max(10px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: rgba(9, 9, 11, 0.9); border-top: 1px solid var(--border);
      z-index: 40; backdrop-filter: blur(12px);
    }
    .c-btn {
      width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; position: relative;
      transition: all 0.2s ease;
    }
    .c-btn:active { transform: scale(0.92); }
    .c-btn.active-blue { background: #0284c7 !important; border-color: #38bdf8 !important; box-shadow: 0 0 16px rgba(56, 189, 248, 0.4); }
    .c-btn.active-purple { background: var(--accent) !important; border-color: #818cf8 !important; box-shadow: 0 0 16px var(--accent-glow); }
    .c-btn.active-pink { background: var(--pink) !important; border-color: #f472b6 !important; box-shadow: 0 0 16px rgba(236,72,153,0.4); }
    .c-btn.active-amber { background: #d97706 !important; border-color: #fbbf24 !important; }
    .c-btn-end { background: #ef4444 !important; border-color: #dc2626 !important; }
    .badge-counter {
      position: absolute; top: -3px; right: -3px; width: 18px; height: 18px;
      background: var(--pink); border-radius: 50%; font-size: 10px; font-weight: bold;
      display: none; align-items: center; justify-content: center;
    }

    /* WhatsApp-Style Slide-In Chat Drawer */
    #chatDrawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 380px;
      background: #111114; border-left: 1px solid var(--border); z-index: 100;
      display: flex; flex-direction: column; transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #chatDrawer.open { transform: translateX(0); }
    .chat-header {
      height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(17, 17, 20, 0.95);
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;
      gap: 10px; scrollbar-width: thin;
    }
    .chat-bubble {
      max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 13px;
      line-height: 1.4; word-break: break-word; display: flex; flex-direction: column;
    }
    .chat-mine {
      align-self: flex-end; background: #005c4b; color: #e9edef;
      border-bottom-right-radius: 3px;
    }
    .chat-theirs {
      align-self: flex-start; background: #202c33; color: #e9edef;
      border-bottom-left-radius: 3px;
    }
    .chat-time {
      font-size: 9.5px; color: rgba(255,255,255,0.5); align-self: flex-end; margin-top: 2px;
    }
    .chat-input-bar {
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); display: flex; gap: 8px; background: #18181b;
    }
    .chat-input {
      flex: 1; height: 40px; background: #27272a; border: 1px solid var(--border);
      border-radius: 20px; color: white; padding: 0 14px; font-size: 13px; outline: none;
    }
    .chat-send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: #00a884; color: white; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 16px;
    }

    /* Audio Soundstage Panel (The Unique Co-Listen Ambience Feature) */
    #soundstageDrawer {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 440px; background: rgba(20, 20, 24, 0.96);
      border: 1px solid var(--border); border-radius: 20px; padding: 16px;
      backdrop-filter: blur(16px); z-index: 90; display: none; flex-direction: column;
      gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .soundstage-title { font-size: 13px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; }
    .stage-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .stage-chips { display: flex; gap: 8px; }
    .amb-chip {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
    }
    .amb-chip.active { background: var(--accent); border-color: var(--accent); }

    /* Lobby */
    #lobbyModal {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; padding: 20px; z-index: 2000;
    }
    .lobby-box {
      background: var(--card); padding: 32px; border-radius: 24px;
      width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border);
    }
    .lobby-box input {
      width: 100%; height: 48px; background: #27272a; border: 1px solid var(--border);
      border-radius: 14px; color: white; text-align: center; margin: 18px 0;
      outline: none; font-size: 15px;
    }
    .lobby-box button {
      width: 100%; height: 48px; border-radius: 24px; border: none;
      background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Minimal Bar -->
  <div class="top-bar">
    <div class="room-pill">
      <span class="status-dot"></span>
      <span id="roomNameDisplay">...</span>
      <button class="btn-pill" id="copyLinkBtn">Copy</button>
    </div>
    <button class="btn-pill" id="openSoundstageBtn">🎧 Soundstage</button>
  </div>

  <!-- Central Audio Stage -->
  <div class="stage-container">
    <div class="peers-row">
      <!-- Local User -->
      <div class="avatar-card">
        <div class="avatar-disc" id="myAvatarDisc">🎙️</div>
        <span class="avatar-name">You</span>
        <span class="avatar-badge" id="myMicStatus">Mic Active</span>
      </div>

      <!-- Remote Partner -->
      <div class="avatar-card">
        <div class="avatar-disc" id="partnerAvatarDisc">👤</div>
        <span class="avatar-name" id="partnerName">Waiting for partner...</span>
        <span class="avatar-badge" id="partnerAudioStatus">Disconnected</span>
      </div>
    </div>

    <!-- Live Audio Frequency Waves -->
    <canvas id="waveCanvas"></canvas>

    <!-- Clear, Accurate Live Subtitles Banner -->
    <div id="subtitlesBanner">
      <div class="sub-speaker" id="subSpeaker">You:</div>
      <div class="sub-text" id="subText">Listening...</div>
    </div>
  </div>

  <!-- Unique Audio Co-Listen Soundstage Drawer -->
  <div id="soundstageDrawer">
    <div class="soundstage-title">Audio Ambience & Co-Listen Soundstage</div>
    
    <div class="stage-row">
      <span>Ambient Soundscape</span>
      <div class="stage-chips">
        <button class="amb-chip" id="ambRainBtn">🌧️ Rain</button>
        <button class="amb-chip" id="ambCampBtn">🔥 Fire</button>
        <button class="amb-chip" id="ambThetaBtn">🧠 Theta</button>
      </div>
    </div>

    <div class="stage-row">
      <span>Partner Ear Position (3D HRTF)</span>
      <select id="pannerSelect" style="background:#27272a; color:#fff; border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:12px; outline:none;">
        <option value="center">Center</option>
        <option value="left">Left Ear</option>
        <option value="right">Right Ear</option>
      </select>
    </div>

    <div class="stage-row">
      <span>Whisper Boost (AGC EQ)</span>
      <button class="amb-chip" id="whisperBoostBtn">🤫 Off</button>
    </div>
  </div>

  <!-- WhatsApp-Style Chat Slide-Over Drawer -->
  <div id="chatDrawer">
    <div class="chat-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 18px;">💬</span>
        <span style="font-size: 14px; font-weight: 600;">Lounge Chat</span>
      </div>
      <button class="btn-pill" id="closeChatBtn" style="color:#ef4444; border:none; font-size:14px;">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div style="text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 20px;">
        Messages are end-to-end P2P encrypted via WebRTC.
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" class="chat-input" placeholder="Message..." />
      <button id="sendMsgBtn" class="chat-send-btn">➤</button>
    </div>
  </div>

  <!-- Bottom Floating Control Dock -->
  <div class="controls-dock">
    <button class="c-btn" id="muteMicBtn" title="Mute/Unmute Mic">🎙️</button>
    <button class="c-btn" id="subsToggleBtn" title="Toggle Live Subtitles">💬</button>
    <button class="c-btn" id="chatToggleBtn" title="Chat">
      ✉️
      <span class="badge-counter" id="chatBadge">0</span>
    </button>
    <button class="c-btn c-btn-end" id="leaveBtn" title="Leave Call">📞</button>
  </div>

  <!-- Audio Element to sink remote stream safely without video frame pipeline -->
  <audio id="remoteAudioSink" autoplay playsinline></audio>

  <!-- Entry Lobby Modal -->
  <div id="lobbyModal">
    <div class="lobby-box">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Audio Lounge</h2>
      <p style="font-size: 13px; color: var(--text-dim);">Pure WebRTC Soundstage & Chat</p>
      <input type="text" id="roomInput" placeholder="Room Name" />
      <button id="enterRoomBtn">Start Call</button>
    </div>
  </div>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + window.location.host);

    let myId = null, localAudioStream = null, processedAudioTrack = null;
    let room = window.location.hash.substring(1).trim() || 'lounge-' + Math.random().toString(36).substring(2, 6);
    const peers = {}, dataChannels = {};

    // Web Audio Engine: DSP, HRTF Spatial Audio & Ambience Synthesis
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null, micSource = null, hpFilter = null, whisperBoostNode = null;
    let compressorNode = null, processedDest = null, localAnalyser = null, remoteAnalyser = null;
    let remoteSourceNode = null, partnerPannerNode = null;

    // Ambient Synthesizers
    let activeAmbience = null; // 'rain', 'fire', 'theta'
    let ambGain = null, ambSource = null;

    // Subtitles Engine
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null, isSubsActive = false, shouldKeepSubsListening = false;

    // Chat State
    let unreadChatCount = 0;
    let isChatOpen = false;

    // DOM References
    const lobbyModal = document.getElementById('lobbyModal');
    const roomInput = document.getElementById('roomInput');
    const enterRoomBtn = document.getElementById('enterRoomBtn');
    const roomNameDisplay = document.getElementById('roomNameDisplay');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const myAvatarDisc = document.getElementById('myAvatarDisc');
    const partnerAvatarDisc = document.getElementById('partnerAvatarDisc');
    const partnerName = document.getElementById('partnerName');
    const myMicStatus = document.getElementById('myMicStatus');
    const partnerAudioStatus = document.getElementById('partnerAudioStatus');
    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');
    const subtitlesBanner = document.getElementById('subtitlesBanner');
    const subSpeaker = document.getElementById('subSpeaker');
    const subText = document.getElementById('subText');

    // Drawer Elements
    const soundstageDrawer = document.getElementById('soundstageDrawer');
    const openSoundstageBtn = document.getElementById('openSoundstageBtn');
    const ambRainBtn = document.getElementById('ambRainBtn');
    const ambCampBtn = document.getElementById('ambCampBtn');
    const ambThetaBtn = document.getElementById('ambThetaBtn');
    const pannerSelect = document.getElementById('pannerSelect');
    const whisperBoostBtn = document.getElementById('whisperBoostBtn');

    // Chat Elements
    const chatDrawer = document.getElementById('chatDrawer');
    const chatToggleBtn = document.getElementById('chatToggleBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const chatBadge = document.getElementById('chatBadge');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendMsgBtn = document.getElementById('sendMsgBtn');

    // Controls
    const muteMicBtn = document.getElementById('muteMicBtn');
    const subsToggleBtn = document.getElementById('subsToggleBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const remoteAudioSink = document.getElementById('remoteAudioSink');

    roomInput.value = room;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    };

    function resizeWaveCanvas() {
      waveCanvas.width = 300;
      waveCanvas.height = 60;
    }
    resizeWaveCanvas();

    // -------------------------------------------------------------
    // 1. WEB AUDIO DSP PIPELINE & 3D SPATIAL HRTF
    // -------------------------------------------------------------
    function initWebAudio(stream) {
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      micSource = audioCtx.createMediaStreamSource(stream);

      // High-pass Rumble Filter (100 Hz cutoff)
      hpFilter = audioCtx.createBiquadFilter();
      hpFilter.type = 'highpass';
      hpFilter.frequency.value = 100;

      // Vocal Presence Peaking Node (3.5 kHz)
      whisperBoostNode = audioCtx.createBiquadFilter();
      whisperBoostNode.type = 'peaking';
      whisperBoostNode.frequency.value = 3500;
      whisperBoostNode.gain.value = 0; // Off by default

      // Auto Gain Control / Compressor
      compressorNode = audioCtx.createDynamicsCompressor();
      compressorNode.threshold.value = -24;
      compressorNode.knee.value = 8;
      compressorNode.ratio.value = 5;
      compressorNode.attack.value = 0.005;
      compressorNode.release.value = 0.2;

      localAnalyser = audioCtx.createAnalyser();
      localAnalyser.fftSize = 64;

      processedDest = audioCtx.createMediaStreamDestination();

      micSource.connect(hpFilter);
      hpFilter.connect(whisperBoostNode);
      whisperBoostNode.connect(compressorNode);
      compressorNode.connect(localAnalyser);
      compressorNode.connect(processedDest);

      processedAudioTrack = processedDest.stream.getAudioTracks()[0];

      // Master Ambient Gain Node
      ambGain = audioCtx.createGain();
      ambGain.gain.value = 0.0;
      ambGain.connect(audioCtx.destination);

      startVisualizerLoop();
    }

    // Connect remote partner stream directly to 3D HRTF Panner
    function connectRemoteSpatialAudio(stream) {
      if (!audioCtx) return;
      try {
        remoteSourceNode = audioCtx.createMediaStreamSource(stream);

        partnerPannerNode = audioCtx.createPanner();
        partnerPannerNode.panningModel = 'HRTF';
        partnerPannerNode.distanceModel = 'inverse';
        partnerPannerNode.positionX.value = 0.0; // Center
        partnerPannerNode.positionY.value = 0.0;
        partnerPannerNode.positionZ.value = -1.0;

        remoteAnalyser = audioCtx.createAnalyser();
        remoteAnalyser.fftSize = 64;

        remoteSourceNode.connect(partnerPannerNode);
        partnerPannerNode.connect(remoteAnalyser);
        remoteAnalyser.connect(audioCtx.destination);

        // Keep sink element active for browser autoplay permissions
        remoteAudioSink.srcObject = stream;
        remoteAudioSink.muted = true; // Audio is rendered through AudioContext destination
      } catch (e) {
        console.warn('Spatial audio routing:', e);
        remoteAudioSink.srcObject = stream;
        remoteAudioSink.muted = false;
      }
    }

    // Panner selection (Left, Center, Right)
    pannerSelect.onchange = () => {
      if (!partnerPannerNode || !audioCtx) return;
      const val = pannerSelect.value;
      const xPos = val === 'left' ? -3.0 : val === 'right' ? 3.0 : 0.0;
      partnerPannerNode.positionX.setTargetAtTime(xPos, audioCtx.currentTime, 0.1);
    };

    // Whisper boost toggle
    let isWhisperBoost = false;
    whisperBoostBtn.onclick = () => {
      isWhisperBoost = !isWhisperBoost;
      whisperBoostBtn.innerText = isWhisperBoost ? '🤫 Active (+8dB)' : '🤫 Off';
      whisperBoostBtn.classList.toggle('active', isWhisperBoost);
      if (whisperBoostNode && audioCtx) {
        whisperBoostNode.gain.setTargetAtTime(isWhisperBoost ? 8 : 0, audioCtx.currentTime, 0.1);
        compressorNode.threshold.setTargetAtTime(isWhisperBoost ? -45 : -24, audioCtx.currentTime, 0.1);
      }
    };

    // -------------------------------------------------------------
    // 2. THE UNIQUE FEATURE: SYNTHESIZED CO-LISTEN AMBIENCE
    // -------------------------------------------------------------
    function stopAmbience() {
      if (ambSource) {
        try { ambSource.stop(); } catch(e){}
        ambSource = null;
      }
      if (ambGain && audioCtx) {
        ambGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
      }
      ambRainBtn.classList.remove('active');
      ambCampBtn.classList.remove('active');
      ambThetaBtn.classList.remove('active');
      activeAmbience = null;
    }

    function playPinkNoise(filterFreq = 800) {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        data[i] = (b0 + b1 + b2 + white * 0.5362) * 0.08;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = filterFreq;

      noise.connect(filter);
      filter.connect(ambGain);
      noise.start();
      return noise;
    }

    ambRainBtn.onclick = () => {
      if (activeAmbience === 'rain') { stopAmbience(); return; }
      stopAmbience();
      ambSource = playPinkNoise(900);
      ambGain.gain.setTargetAtTime(0.18, audioCtx.currentTime, 0.3);
      ambRainBtn.classList.add('active');
      activeAmbience = 'rain';
    };

    ambCampBtn.onclick = () => {
      if (activeAmbience === 'camp') { stopAmbience(); return; }
      stopAmbience();
      ambSource = playPinkNoise(450);
      ambGain.gain.setTargetAtTime(0.22, audioCtx.currentTime, 0.3);
      ambCampBtn.classList.add('active');
      activeAmbience = 'camp';
    };

    ambThetaBtn.onclick = () => {
      if (activeAmbience === 'theta') { stopAmbience(); return; }
      stopAmbience();

      const merger = audioCtx.createChannelMerger(2);
      const oscL = audioCtx.createOscillator();
      const oscR = audioCtx.createOscillator();
      oscL.frequency.value = 200; // Left ear
      oscR.frequency.value = 206; // Right ear (6 Hz Theta beat)

      const gain = audioCtx.createGain();
      gain.gain.value = 0.06;

      oscL.connect(merger, 0, 0);
      oscR.connect(merger, 0, 1);
      merger.connect(gain);
      gain.connect(ambGain);

      oscL.start(); oscR.start();
      ambGain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.3);
      ambThetaBtn.classList.add('active');
      ambSource = oscL;
      activeAmbience = 'theta';
    };

    openSoundstageBtn.onclick = () => {
      const isHidden = soundstageDrawer.style.display !== 'flex';
      soundstageDrawer.style.display = isHidden ? 'flex' : 'none';
      openSoundstageBtn.innerText = isHidden ? '✕ Close' : '🎧 Soundstage';
    };

    // -------------------------------------------------------------
    // 3. VOICE PULSE ANIMATION & AUDIO FREQUENCY WAVE VISUALIZER
    // -------------------------------------------------------------
    function startVisualizerLoop() {
      const localBuf = new Uint8Array(32);
      const remoteBuf = new Uint8Array(32);

      function render() {
        waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);

        let localLevel = 0;
        let remoteLevel = 0;

        if (localAnalyser) {
          localAnalyser.getByteFrequencyData(localBuf);
          let sum = 0;
          for (let i = 0; i < localBuf.length; i++) sum += localBuf[i];
          localLevel = sum / localBuf.length;
        }

        if (remoteAnalyser) {
          remoteAnalyser.getByteFrequencyData(remoteBuf);
          let sum = 0;
          for (let i = 0; i < remoteBuf.length; i++) sum += remoteBuf[i];
          remoteLevel = sum / remoteBuf.length;
        }

        // Pulse User Avatar
        if (localLevel > 18 && !isMuted) {
          myAvatarDisc.classList.add('speaking');
        } else {
          myAvatarDisc.classList.remove('speaking');
        }

        // Pulse Partner Avatar
        if (remoteLevel > 16) {
          partnerAvatarDisc.classList.add('partner-speaking');
        } else {
          partnerAvatarDisc.classList.remove('partner-speaking');
        }

        // Draw Minimal Center Waves
        const activeLevel = Math.max(localLevel, remoteLevel);
        const barWidth = 4;
        const gap = 3;
        const count = 28;
        const startX = (waveCanvas.width - (count * (barWidth + gap))) / 2;

        for (let i = 0; i < count; i++) {
          const factor = Math.sin((i / count) * Math.PI);
          const height = Math.min(50, Math.max(4, (activeLevel / 3) * factor + Math.random() * 2));
          const x = startX + i * (barWidth + gap);
          const y = (waveCanvas.height - height) / 2;

          waveCtx.fillStyle = remoteLevel > localLevel ? '#ec4899' : '#6366f1';
          waveCtx.beginPath();
          waveCtx.roundRect(x, y, barWidth, height, 2);
          waveCtx.fill();
        }

        requestAnimationFrame(render);
      }
      render();
    }

    // -------------------------------------------------------------
    // 4. ACCURATE, CONTINUOUS LIVE SUBTITLES (WITHOUT TRANSLATION)
    // -------------------------------------------------------------
    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.continuous = true;
      recognizer.interimResults = true;
      recognizer.lang = 'en-US';

      recognizer.onresult = (e) => {
        let interim = '';
        let final = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        const text = (final || interim).trim();
        if (text.length > 0) {
          showSubtitle("You", text);
          broadcastData({ type: 'LIVE_SUB', speaker: 'Partner', text });
        }
      };

      recognizer.onend = () => {
        if (shouldKeepSubsListening && isSubsActive) {
          try { recognizer.start(); } catch (err) {}
        }
      };
    }

    subsToggleBtn.onclick = () => {
      if (!SpeechRecognition) return alert('Speech recognition is supported in Chrome & Edge over HTTPS.');
      isSubsActive = !isSubsActive;
      subsToggleBtn.classList.toggle('active-amber', isSubsActive);

      if (isSubsActive) {
        shouldKeepSubsListening = true;
        try { recognizer.start(); } catch(e){}
        subtitlesBanner.style.display = 'block';
        subSpeaker.innerText = 'You:';
        subText.innerText = 'Listening...';
      } else {
        shouldKeepSubsListening = false;
        try { recognizer.stop(); } catch(e){}
        subtitlesBanner.style.display = 'none';
      }
    };

    function showSubtitle(speaker, text) {
      subtitlesBanner.style.display = 'block';
      subSpeaker.innerText = `${speaker}:`;
      subSpeaker.style.color = speaker === 'You' ? '#38bdf8' : '#ec4899';
      subText.innerText = text;

      clearTimeout(window.subTimer);
      window.subTimer = setTimeout(() => {
        if (!isSubsActive) subtitlesBanner.style.display = 'none';
        else subText.innerText = 'Listening...';
      }, 4000);
    }

    // -------------------------------------------------------------
    // 5. WHATSAPP-STYLE P2P CHAT SYSTEM
    // -------------------------------------------------------------
    chatToggleBtn.onclick = () => {
      isChatOpen = !isChatOpen;
      chatDrawer.classList.toggle('open', isChatOpen);
      if (isChatOpen) {
        unreadChatCount = 0;
        chatBadge.style.display = 'none';
        chatInput.focus();
      }
    };
    closeChatBtn.onclick = () => {
      isChatOpen = false;
      chatDrawer.classList.remove('open');
    };

    function appendMessage(text, isMine) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${isMine ? 'chat-mine' : 'chat-theirs'}`;
      
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      bubble.innerHTML = `<span>${escapeHtml(text)}</span><span class="chat-time">${timeStr}</span>`;
      
      chatMessages.appendChild(bubble);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!isMine && !isChatOpen) {
        unreadChatCount++;
        chatBadge.innerText = unreadChatCount;
        chatBadge.style.display = 'flex';
      }
    }

    sendMsgBtn.onclick = sendChatMessage;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage(); };

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      appendMessage(text, true);
      broadcastData({ type: 'CHAT_MSG', text });
      chatInput.value = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // -------------------------------------------------------------
    // 6. WEBRTC P2P SIGNALING & MEDIA FLOW
    // -------------------------------------------------------------
    function broadcastData(obj) {
      const msg = JSON.stringify(obj);
      Object.values(dataChannels).forEach(dc => {
        if (dc.readyState === 'open') dc.send(msg);
      });
    }

    function setupDataChannel(id, dc) {
      dataChannels[id] = dc;
      dc.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'LIVE_SUB') {
          showSubtitle(m.speaker, m.text);
        } else if (m.type === 'CHAT_MSG') {
          appendMessage(m.text, false);
        } else if (m.type === 'PARTNER_MIC_STATUS') {
          partnerAudioStatus.innerText = m.muted ? 'Partner Muted' : 'Speaking';
          partnerAudioStatus.style.color = m.muted ? '#f59e0b' : '#22c55e';
        }
      };
    }

    ws.onmessage = async (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'room-info') {
        myId = data.myId;
        data.peers.forEach(pId => createPeerConnection(pId, true));
      } else if (data.type === 'offer') {
        const pc = createPeerConnection(data.sender, false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        ws.send(JSON.stringify({ target: data.sender, type: 'answer', payload: ans }));
      } else if (data.type === 'answer') {
        const pc = peers[data.sender];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
      } else if (data.type === 'candidate') {
        const pc = peers[data.sender];
        if (pc && data.payload) pc.addIceCandidate(new RTCIceCandidate(data.payload));
      } else if (data.type === 'peer-left') {
        if (peers[data.peerId]) { peers[data.peerId].close(); delete peers[data.peerId]; }
        partnerName.innerText = 'Partner Left';
        partnerAudioStatus.innerText = 'Disconnected';
        partnerAudioStatus.style.color = 'var(--text-dim)';
      }
    };

    function createPeerConnection(peerId, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peers[peerId] = pc;

      if (processedAudioTrack) pc.addTrack(processedAudioTrack, localAudioStream);

      if (isInitiator) {
        const dc = pc.createDataChannel('audioLoungeChat');
        setupDataChannel(peerId, dc);
        pc.onnegotiationneeded = async () => {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({ target: peerId, type: 'offer', payload: offer }));
        };
      } else {
        pc.ondatachannel = (ev) => setupDataChannel(peerId, ev.channel);
      }

      pc.ontrack = (evt) => {
        partnerName.innerText = 'Connected Partner';
        partnerAudioStatus.innerText = 'Speaking';
        partnerAudioStatus.style.color = '#22c55e';
        connectRemoteSpatialAudio(evt.streams[0]);
      };

      pc.onicecandidate = (ev) => {
        if (ev.candidate) ws.send(JSON.stringify({ target: peerId, type: 'candidate', payload: ev.candidate }));
      };

      return pc;
    }

    // -------------------------------------------------------------
    // 7. INITIALIZATION & CONTROLS
    // -------------------------------------------------------------
    enterRoomBtn.onclick = async () => {
      room = roomInput.value.trim().toLowerCase().replace(/\s+/g, '-') || 'suite-audio';
      window.location.hash = room;
      roomNameDisplay.innerText = room;

      try {
        // High quality echo-cancelled microphone capture
        localAudioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false // Handled inside our Web Audio DSP graph
          },
          video: false
        });

        initWebAudio(localAudioStream);
        lobbyModal.style.display = 'none';

        ws.send(JSON.stringify({ room, type: 'join' }));
      } catch (err) {
        alert('Microphone permission required for audio call: ' + err.message);
      }
    };

    let isMuted = false;
    muteMicBtn.onclick = () => {
      if (!localAudioStream) return;
      isMuted = !isMuted;
      localAudioStream.getAudioTracks()[0].enabled = !isMuted;
      if (processedAudioTrack) processedAudioTrack.enabled = !isMuted;

      muteMicBtn.classList.toggle('active-amber', isMuted);
      myMicStatus.innerText = isMuted ? 'Muted' : 'Mic Active';
      myMicStatus.style.color = isMuted ? '#f59e0b' : 'var(--text-dim)';
      broadcastData({ type: 'PARTNER_MIC_STATUS', muted: isMuted });
    };

    copyLinkBtn.onclick = () => {
      navigator.clipboard.writeText(window.location.origin + '/#' + room).then(() => {
        copyLinkBtn.innerText = 'Copied!';
        setTimeout(() => copyLinkBtn.innerText = 'Copy', 2000);
      });
    };

    leaveBtn.onclick = () => {
      if (localAudioStream) localAudioStream.getTracks().forEach(t => t.stop());
      location.reload();
    };
  </script>
</body>

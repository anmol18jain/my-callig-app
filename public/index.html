<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json">
  <title>Voice App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; padding: 40px 20px; }
    .header { text-align: center; margin-top: 20px; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: #2a2a2a; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    #status { color: #888; font-size: 15px; margin-top: 8px; }
    .controls { display: flex; gap: 20px; margin-bottom: 30px; width: 100%; max-width: 320px; justify-content: center; }
    button { flex: 1; height: 60px; border-radius: 30px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
    #callBtn { background: #25D366; color: white; }
    #muteBtn { background: #333; color: white; display: none; }
    #hangupBtn { background: #FF3B30; color: white; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">🎙️</div>
    <h2>Global Room</h2>
    <p id="status">Connecting...</p>
  </div>

  <div class="controls">
    <button id="callBtn">Start Call</button>
    <button id="muteBtn">Mute</button>
    <button id="hangupBtn">End</button>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + window.location.host);
    const room = 'global-voice-room';
    let pc, localStream, isMuted = false;

    const callBtn = document.getElementById('callBtn');
    const muteBtn = document.getElementById('muteBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const statusText = document.getElementById('status');
    const remoteAudio = document.getElementById('remoteAudio');

    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    ws.onopen = () => { ws.send(JSON.stringify({ room, type: 'join' })); statusText.innerText = 'Ready to talk'; };

    ws.onmessage = async (e) => {
      const { type, payload } = JSON.parse(e.data);
      if (type === 'offer') {
        await initPeer();
        await pc.setRemoteDescription(new RTCSessionDescription(payload));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ room, type: 'answer', payload: answer }));
        showInCallUI();
      } else if (type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(payload));
        showInCallUI();
      } else if (type === 'candidate' && pc) {
        await pc.addIceCandidate(new RTCIceCandidate(payload));
      } else if (type === 'hangup') { resetSession(false); }
    };

    async function initPeer() {
      if (pc) return;
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      pc = new RTCPeerConnection(config);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.ontrack = (event) => { remoteAudio.srcObject = event.streams[0]; remoteAudio.play(); };
      pc.onicecandidate = (event) => { if (event.candidate) ws.send(JSON.stringify({ room, type: 'candidate', payload: event.candidate })); };
    }

    callBtn.onclick = async () => {
      statusText.innerText = 'Calling...';
      await initPeer();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ room, type: 'offer', payload: offer }));
    };

    muteBtn.onclick = () => {
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      muteBtn.innerText = isMuted ? 'Unmute' : 'Mute';
      muteBtn.style.background = isMuted ? '#f59e0b' : '#333';
    };

    hangupBtn.onclick = () => resetSession(true);

    function resetSession(notify) {
      if (notify) ws.send(JSON.stringify({ room, type: 'hangup' }));
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (pc) pc.close();
      pc = null; localStream = null;
      callBtn.style.display = 'block'; muteBtn.style.display = 'none'; hangupBtn.style.display = 'none';
      statusText.innerText = 'Ready to talk';
    }

    function showInCallUI() {
      callBtn.style.display = 'none'; muteBtn.style.display = 'block'; hangupBtn.style.display = 'block';
      statusText.innerText = 'Connected';
    }
  </script>
</body>
</html>
